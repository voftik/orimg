name: Bug report
description: Something broke
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: orimg version
      placeholder: orimg --version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and jobs file
      description: The command you ran; attach the jobs file if used (strip anything private).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: JSON envelope / stderr / exit code.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: orimg doctor --json
      description: Paste the output — it masks your API key.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: macOS 15 / Node 22.4

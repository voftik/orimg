name: Feature request
description: An idea to make orimg better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you (or your agent) do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / fan-out engine
        - Agent skill / prompt dialects
        - Gallery / output UX
        - New model support
        - Docs
    validations:
      required: true
